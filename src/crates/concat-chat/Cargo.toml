[package]
name = "concat-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Claude Code as a chat beside the timeline: finding it, running it headless on the project open in the window, reading its stream, and the playhead context each message carries."

[dependencies]
concat-project.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# runner.rs: a job object, so Stop ends Claude Code and every process it
# started at once (taskkill /T takes over ten seconds on some machines).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
